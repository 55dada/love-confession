<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表白</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .message {
            color: white;
            font-size: 1.2em;
            line-height: 1.7;
            margin-bottom: 30px;
        }
        .heart {
            font-size: 4em;
            margin: 20px 0;
            animation: heartbeat 1.5s infinite;
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .yes-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }
        .no-btn {
            background: linear-gradient(135deg, #f44336, #da190b);
            color: white;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .hidden {
            display: none !important;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @media (max-width: 600px) {
            .buttons { flex-direction: column; gap: 15px; }
            button { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>
    <div class="container" id="mainContent">
        <h1>💕 致我心中的你 💕</h1>
        <div class="message">
            <p>从遇见你的那一刻起，我的世界变得不一样了。</p>
            <p>你的笑容像阳光一样温暖，你的声音如音乐般动听。</p>
            <p>我想和你一起看遍世间风景，分享生活的点点滴滴。</p>
            <p>你愿意给我一个机会，让我成为你生命中的那个人吗？</p>
        </div>
        <div class="heart">💕</div>
        
        <div class="buttons">
            <button class="yes-btn" onclick="showSuccess()">我愿意！</button>
            <button class="no-btn" id="noBtn" onclick="moveNoButton()" onmouseover="moveNoButton()">再考虑一下</button>
        </div>
    </div>
    
    <div class="container hidden" id="successMessage">
        <h1>🎉 太棒了！🎉</h1>
        <div class="message">
            <p>我就知道你会答应的！</p>
            <p>从今天起，让我们一起创造美好的回忆吧！</p>
        </div>
        <div class="heart">💕</div>
        <button class="yes-btn" onclick="showMain()">再看一遍</button>
    </div>

    <script>
        var count = 0;

        function showSuccess() {
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            makeFireworks();
        }

        function showMain() {
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            resetButton();
        }

        function moveNoButton() {
            var btn = document.getElementById('noBtn');
            if (!btn) return;
            
            count++;
            
            var x = Math.random() * 200 + 50;
            var y = Math.random() * 100 + 50;
            
            btn.style.position = 'relative';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
            btn.style.transition = 'all 0.5s ease';
            
            if (count >= 3) {
                btn.textContent = '我知道你愿意~ 💕';
                btn.style.background = 'linear-gradient(135deg, #ff69b4, #ff1493)';
                setTimeout(showSuccess, 2000);
            } else {
                var msgs = ['再想想吧~', '真的不要吗？', '点绿色的那个嘛'];
                btn.textContent = msgs[count - 1];
            }
        }

        function resetButton() {
            var btn = document.getElementById('noBtn');
            if (btn) {
                btn.style.position = '';
                btn.style.left = '';
                btn.style.top = '';
                btn.style.background = '';
                btn.style.transition = '';
                btn.textContent = '再考虑一下';
                count = 0;
            }
        }

        function makeFireworks() {
            for (var i = 0; i < 10; i++) {
                setTimeout(createFirework, i * 200);
            }
        }

        function createFirework() {
            var colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7'];
            var firework = document.createElement('div');
            var color = colors[Math.floor(Math.random() * colors.length)];
            var x = Math.random() * window.innerWidth;
            var y = Math.random() * window.innerHeight;
            
            firework.style.cssText = 'position:fixed;width:6px;height:6px;background:' + color + ';border-radius:50%;left:' + x + 'px;top:' + y + 'px;pointer-events:none;';
            
            document.body.appendChild(firework);
            
            setTimeout(function() {
                if (firework.parentNode) {
                    firework.parentNode.removeChild(firework);
                }
            }, 1500);
        }

        console.log('页面加载完成');
    </script>
</body>
</html>
