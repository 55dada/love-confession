<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 我的表白 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            color: #e91e63;
            animation: float 6s ease-in-out infinite;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        /* 手机端样式 */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px 15px; }
            h1 { font-size: 1.8em; margin-bottom: 15px; }
            .message { font-size: 1em; margin-bottom: 20px; }
            .heart { font-size: 2.2em; margin: 12px 0; }
            .buttons { flex-direction: column; gap: 12px; }
            button { width: 100%; max-width: 280px; }
        }

        h1 { color: #e91e63; font-size: 2.5em; margin-bottom: 20px; }
        .message { font-size: 1.2em; line-height: 1.6; color: #333; margin-bottom: 30px; text-align: left; }
        .heart { font-size: 3em; margin: 20px 0; animation: heartbeat 1.5s ease-in-out infinite; }
        .buttons { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        button { padding: 12px 30px; font-size: 18px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); transition: all 0.3s ease; }
        .yes-btn { background: #4CAF50; color: white; }
        .no-btn { background: #f44336; color: white; }
        .yes-btn:hover { background: #45a049; transform: translateY(-2px); }
        .no-btn:hover { background: #da190b; }
        
        .hidden { display: none !important; }
        
        /* 过渡页面样式 */
        .romantic-scene {
            position: relative;
            height: 400px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .love-title {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.5);
        }
        
        .countdown {
            font-size: 2em;
            color: #ff69b4;
            margin-top: 20px;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
        }
        
        .success-message {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ff6b9d 100%);
            color: white;
            padding: 45px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }
        
        .success-message h1 {
            font-size: 2.8em;
            margin-bottom: 20px;
            color: white;
        }
        
        .success-message .message {
            font-size: 1.2em;
            line-height: 1.7;
            margin-bottom: 25px;
            color: white;
            text-align: center;
        }

        @keyframes float {
            0% { opacity: 0; transform: translateY(100vh) rotate(0deg); }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100vh) rotate(720deg); }
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- 主页面 -->
    <div class="container" id="mainContent">
        <h1>💕 致我心中的你 💕</h1>
        <div class="message">
            <p>从遇见你的那一刻起，我的世界变得不一样了。</p>
            <p>你的笑容像阳光一样温暖，你的声音如音乐般动听。</p>
            <p>我想和你一起看遍世间风景，分享生活的点点滴滴。</p>
            <p>你愿意给我一个机会，让我成为你生命中的那个人吗？</p>
        </div>
        <div class="heart">💕</div>
        
        <div class="buttons">
            <button class="yes-btn" id="yesBtn" onclick="handleYes()">我愿意！</button>
            <button class="no-btn" id="noBtn" onclick="moveNoButton()">再考虑一下</button>
        </div>
    </div>
    
    <!-- 过渡页面 -->
    <div class="container hidden" id="transitionPage">
        <div class="romantic-scene">
            <div class="love-title">LOVE</div>
            <div class="love-title" style="font-size: 1.5em;">爱情正在绽放</div>
            <div style="font-size: 4em;">💕</div>
            <div class="countdown" id="countdown">10</div>
        </div>
    </div>

    <!-- 成功页面 -->
    <div class="container hidden" id="successMessage">
        <div class="success-message">
            <div class="heart">💖</div>
            <h1>我也爱你！💕</h1>
            <div class="message">
                <p>这是我听过最美的三个字，</p>
                <p>从现在开始，你的快乐就是我的快乐，</p>
                <p>你的幸福就是我的幸福。</p>
                <p>我承诺：永远不会让你失望，用尽所有力气让你幸福！</p>
                <p>让我们一起写下最美好的故事...📖✨</p>
            </div>
            <button onclick="resetPage()" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin-top: 20px;">重温这一刻</button>
        </div>
    </div>

    <script>
        // 全局变量
        let moveCount = 0;
        let countdownInterval = null;

        console.log("页面开始加载...");

        // 创建漂浮的爱心
        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            const hearts = ['❤️', '💕', '💖', '💗', '💓', '💘'];
            
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    heart.style.fontSize = (Math.random() * 10 + 15) + 'px';
                    container.appendChild(heart);
                    
                    setTimeout(() => {
                        if (heart.parentNode) {
                            heart.parentNode.removeChild(heart);
                        }
                    }, 7000);
                }, i * 300);
            }
        }

        // 处理"我愿意"按钮点击
        function handleYes() {
            console.log("点击了'我愿意'按钮");
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('transitionPage').classList.remove('hidden');
            startCountdown();
        }

        // 处理"再考虑一下"按钮移动
        function moveNoButton() {
            console.log("点击了'再考虑一下'按钮，次数：" + moveCount);
            const button = document.getElementById('noBtn');
            moveCount++;
            
            const x = Math.max(20, Math.min(window.innerWidth - 200, Math.random() * (window.innerWidth - 200)));
            const y = Math.max(20, Math.min(window.innerHeight - 100, Math.random() * (window.innerHeight - 100)));
            
            button.style.position = 'fixed';
            button.style.left = x + 'px';
            button.style.top = y + 'px';
            button.style.zIndex = '1000';
            button.style.transition = 'all 0.3s ease';
            
            const messages = [
                '再想想吧~', '真的不要吗？', '点绿色的那个嘛', '别点了别点了~', 
                '哈哈追不到我', '就逗你玩呢', '再点也没用哦', '我是不会变的',
                '放弃吧哈哈哈', '求你了点绿色'
            ];
            
            const messageIndex = Math.min(moveCount - 1, messages.length - 1);
            button.textContent = messages[messageIndex];
        }

        // 倒计时功能
        function startCountdown() {
            let seconds = 10;
            const countdownEl = document.getElementById('countdown');
            
            countdownEl.textContent = seconds;
            
            countdownInterval = setInterval(() => {
                seconds--;
                countdownEl.textContent = seconds;
                
                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                    showSuccessPage();
                }
            }, 1000);
        }

        // 显示成功页面
        function showSuccessPage() {
            document.getElementById('transitionPage').classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');
        }

        // 重置页面
        function resetPage() {
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('successMessage').classList.add('hidden');
            document.getElementById('transitionPage').classList.add('hidden');
            
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = '';
            noBtn.style.left = '';
            noBtn.style.top = '';
            noBtn.style.zIndex = '';
            noBtn.textContent = '再考虑一下';
            
            moveCount = 0;
            
            const countdownEl = document.getElementById('countdown');
            countdownEl.textContent = '10';
        }

        // 页面加载完成后初始化
        window.onload = function() {
            console.log("页面加载完成");
            createFloatingHearts();
            setInterval(createFloatingHearts, 5000);
            console.log("初始化完成！");
        };

        // 额外的初始化保障
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            console.log("页面已加载，立即初始化");
            createFloatingHearts();
            setInterval(createFloatingHearts, 5000);
        }
    </script>
</body>
</html>
