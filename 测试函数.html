<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>函数测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .test-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        button {
            margin: 10px;
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .yes-btn { background: #4CAF50; color: white; }
        .no-btn { background: #f44336; color: white; }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            min-height: 50px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>🔧 函数定义测试</h2>
        <p>检查函数是否正确定义：</p>
        
        <button class="yes-btn" id="yesBtn">测试 handleYes</button>
        <button class="no-btn" id="noBtn">测试 moveNoButton</button>
        <button onclick="checkFunctions()">检查函数</button>
        
        <div id="result" class="result">
            点击"检查函数"查看状态...
        </div>
    </div>

    <script>
        console.log("测试页面加载");

        // 复制主页面的函数
        let moveCount = 0;

        function handleYes() {
            console.log("✅ handleYes 函数正常工作！");
            document.getElementById('result').innerHTML = 
                '<div style="color: green;">✅ handleYes 函数测试成功！<br>按钮点击事件正常</div>';
        }

        function moveNoButton() {
            console.log("✅ moveNoButton 函数正常工作！");
            moveCount++;
            document.getElementById('result').innerHTML = 
                '<div style="color: orange;">✅ moveNoButton 函数测试成功！<br>点击次数：' + moveCount + '</div>';
            
            // 简单的按钮移动效果
            const btn = document.getElementById('noBtn');
            if (btn) {
                btn.style.transform = 'translate(' + (Math.random() * 40 - 20) + 'px, ' + (Math.random() * 40 - 20) + 'px)';
            }
        }

        function checkFunctions() {
            const result = document.getElementById('result');
            let html = '<h3>函数检查结果：</h3>';
            
            html += '<p><strong>handleYes 函数：</strong> ' + (typeof handleYes === 'function' ? '✅ 已定义' : '❌ 未定义') + '</p>';
            html += '<p><strong>moveNoButton 函数：</strong> ' + (typeof moveNoButton === 'function' ? '✅ 已定义' : '❌ 未定义') + '</p>';
            html += '<p><strong>moveCount 变量：</strong> ' + moveCount + '</p>';
            
            html += '<h3>按钮检查：</h3>';
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            
            html += '<p><strong>愿意按钮：</strong> ' + (yesBtn ? '✅ 找到' : '❌ 未找到') + '</p>';
            html += '<p><strong>不愿意按钮：</strong> ' + (noBtn ? '✅ 找到' : '❌ 未找到') + '</p>';
            
            html += '<h3>事件绑定检查：</h3>';
            html += '<p><strong>愿意按钮事件：</strong> ' + (yesBtn && yesBtn.onclick ? '✅ 已绑定' : '❌ 未绑定') + '</p>';
            html += '<p><strong>不愿意按钮事件：</strong> ' + (noBtn && noBtn.onclick ? '✅ 已绑定' : '❌ 未绑定') + '</p>';
            
            result.innerHTML = html;
        }

        // 页面加载后绑定事件
        window.onload = function() {
            console.log("绑定测试事件");
            
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            
            if (yesBtn) {
                yesBtn.onclick = handleYes;
                console.log("愿意按钮绑定成功");
            }
            
            if (noBtn) {
                noBtn.onclick = moveNoButton;
                console.log("不愿意按钮绑定成功");
            }
            
            // 自动检查一次
            setTimeout(checkFunctions, 500);
        };
    </script>
</body>
</html>
